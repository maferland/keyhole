<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="keyhole">
  <defs>
    <linearGradient id="kh-tile" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0e1411"/>
      <stop offset="1" stop-color="#070b09"/>
